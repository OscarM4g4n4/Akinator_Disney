<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akinator Disney</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Nunito', sans-serif;
            min-height: 100vh;
            background: radial-gradient(ellipse at top, #0d1b4b 0%, #060d26 60%, #000510 100%);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Estrellas de fondo */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.8) 0%, transparent 100%),
                radial-gradient(1px 1px at 80% 10%, rgba(255,255,255,0.6) 0%, transparent 100%),
                radial-gradient(1.5px 1.5px at 50% 60%, rgba(255,255,255,0.7) 0%, transparent 100%),
                radial-gradient(1px 1px at 10% 80%, rgba(255,255,255,0.5) 0%, transparent 100%),
                radial-gradient(1px 1px at 90% 70%, rgba(255,255,255,0.6) 0%, transparent 100%),
                radial-gradient(1px 1px at 35% 15%, rgba(255,255,255,0.4) 0%, transparent 100%),
                radial-gradient(1.5px 1.5px at 65% 85%, rgba(255,255,255,0.5) 0%, transparent 100%),
                radial-gradient(1px 1px at 75% 45%, rgba(255,255,255,0.3) 0%, transparent 100%);
            pointer-events: none;
            z-index: 0;
        }

        .wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 560px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
        }

        /* Contenedor del Genio */
        .genie-container {
            position: relative;
            width: 260px;
            height: 280px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            margin-bottom: -20px;
            z-index: 10;
        }

        .genie-img {
            position: absolute;
            bottom: 0;
            max-width: 240px;
            max-height: 280px;
            object-fit: contain;
            opacity: 0;
            transform: translateY(20px) scale(0.95);
            transition: opacity 0.4s ease, transform 0.4s ease;
            filter: drop-shadow(0 8px 24px rgba(80, 150, 255, 0.5));
        }

        .genie-img.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .genie-img.win {
            max-width: 280px;
            max-height: 300px;
            filter: drop-shadow(0 10px 30px rgba(120, 80, 255, 0.7));
        }

        /* Bocadillo de pensamiento */
        .bubble {
            position: absolute;
            top: -10px;
            right: -30px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            animation: pulse-bubble 1.5s ease-in-out infinite;
        }

        @keyframes pulse-bubble {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        /* Tarjeta principal */
        .card {
            width: 100%;
            background: linear-gradient(145deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.03) 100%);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 24px;
            padding: 32px 28px 28px;
            backdrop-filter: blur(20px);
            box-shadow:
                0 20px 60px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(255,255,255,0.15),
                0 0 40px rgba(80,120,255,0.1);
            text-align: center;
        }

        /* Título */
        .titulo {
            font-family: 'Cinzel', serif;
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(135deg, #ffd700 0%, #ffaa00 50%, #ff8c00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
            margin-bottom: 4px;
            text-shadow: none;
        }

        .subtitulo {
            font-size: 13px;
            color: rgba(150, 180, 255, 0.7);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 24px;
        }

        /* Divisor mágico */
        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
        }
        .divider-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,200,50,0.4), transparent);
        }
        .divider-star {
            color: #ffd700;
            font-size: 14px;
        }

        /* Contador de preguntas */
        .contador {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 20px;
        }
        .contador-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            transition: background 0.3s ease, transform 0.3s ease;
        }
        .contador-dot.activo {
            background: #ffd700;
            transform: scale(1.3);
            box-shadow: 0 0 6px rgba(255,215,0,0.6);
        }

        /* Cuadro de pregunta */
        .pregunta-box {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 20px 24px;
            margin-bottom: 24px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pregunta-texto {
            font-size: 20px;
            font-weight: 700;
            color: #e8f0ff;
            line-height: 1.4;
            transition: opacity 0.3s ease;
        }

        .pregunta-texto.thinking {
            font-size: 16px;
            color: rgba(200,220,255,0.6);
            font-style: italic;
        }

        /* Botones */
        .botones {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .btn {
            flex: 1;
            max-width: 180px;
            padding: 16px 20px;
            font-size: 18px;
            font-weight: 800;
            font-family: 'Nunito', sans-serif;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
            letter-spacing: 1px;
        }

        .btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255,255,255,0.1);
            transform: translateY(100%);
            transition: transform 0.2s ease;
        }

        .btn:hover::before { transform: translateY(0); }
        .btn:active { transform: scale(0.96); }

        .btn-si {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            box-shadow: 0 4px 20px rgba(34,197,94,0.35);
        }
        .btn-si:hover { box-shadow: 0 6px 28px rgba(34,197,94,0.5); }

        .btn-no {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            box-shadow: 0 4px 20px rgba(239,68,68,0.35);
        }
        .btn-no:hover { box-shadow: 0 6px 28px rgba(239,68,68,0.5); }

        .btn-restart {
            background: linear-gradient(135deg, #7c3aed, #5b21b6);
            color: white;
            box-shadow: 0 4px 20px rgba(124,58,237,0.35);
            display: none;
            margin: 0 auto;
            padding: 14px 36px;
            font-size: 16px;
        }

        /* Resultado victoria */
        .resultado-personaje {
            font-family: 'Cinzel', serif;
            font-size: 30px;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 0 30px rgba(255,215,0,0.6);
            margin: 8px 0 4px;
            animation: glow-text 1.5s ease-in-out infinite alternate;
        }

        @keyframes glow-text {
            from { text-shadow: 0 0 20px rgba(255,215,0,0.5); }
            to { text-shadow: 0 0 40px rgba(255,215,0,0.9), 0 0 60px rgba(255,150,0,0.4); }
        }

        /* Debug */
        .debug {
            margin-top: 16px;
            font-size: 11px;
            color: rgba(148, 163, 184, 0.5);
            text-align: left;
            background: rgba(0,0,0,0.3);
            padding: 8px 12px;
            border-radius: 8px;
            font-family: monospace;
            word-break: break-all;
        }

        /* Animación de entrada */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .card { animation: fadeInUp 0.6s ease forwards; }

        /* Estrellas flotantes en victoria */
        .confetti-star {
            position: fixed;
            pointer-events: none;
            font-size: 20px;
            animation: fall 2.5s ease-in forwards;
            z-index: 100;
        }
        @keyframes fall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>

        <div class="bubble" id="burbuja">🔮</div>
    </div>

    <!-- Tarjeta -->
    <div class="card">
        <div class="titulo">AKINATOR</div>
        <div class="subtitulo">✦ Edición Disney ✦</div>

        <div class="divider">
            <div class="divider-line"></div>
            <div class="divider-star">★</div>
            <div class="divider-line"></div>
        </div>

        <!-- Contador de preguntas -->
        <div class="contador" id="contador">
            <div class="contador-dot activo" id="dot-0"></div>
            <div class="contador-dot" id="dot-1"></div>
            <div class="contador-dot" id="dot-2"></div>
            <div class="contador-dot" id="dot-3"></div>
            <div class="contador-dot" id="dot-4"></div>
            <div class="contador-dot" id="dot-5"></div>
            <div class="contador-dot" id="dot-6"></div>
            <div class="contador-dot" id="dot-7"></div>
            <div class="contador-dot" id="dot-8"></div>
            <div class="contador-dot" id="dot-9"></div>
        </div>

        <div class="pregunta-box">
            <div class="pregunta-texto" id="texto-pregunta">Conectando con la lámpara mágica...</div>
        </div>

        <div class="botones" id="contenedor-botones">
            <button class="btn btn-si" onclick="enviarRespuesta('si')">✓ &nbsp;Sí</button>
            <button class="btn btn-no" onclick="enviarRespuesta('no')">✗ &nbsp;No</button>
        </div>

        <button class="btn btn-restart" id="btn-restart" onclick="reiniciar()">🔮 Jugar de nuevo</button>

        <div class="debug" id="consola-debug">Historial: {}</div>
    </div>

</div>

<script>
    let historialRespuestas = {};
    let caracteristicaActual = "";
    let numPreguntas = 0;

    function formatearTexto(texto) {
        return texto.split('_').join(' ');
    }

    function setGenie(estado) {
        // estado: 'normal' | 'thinking' | 'win'
        const g1 = document.getElementById('genie1');
        const g2 = document.getElementById('genie2');
        const g3 = document.getElementById('genie3');
        const burbuja = document.getElementById('burbuja');

        g1.classList.remove('visible');
        g2.classList.remove('visible');
        g3.classList.remove('visible');

        if (estado === 'normal') {
            g1.classList.add('visible');
            burbuja.style.display = 'flex';
            burbuja.textContent = '🔮';
        } else if (estado === 'thinking') {
            g2.classList.add('visible');
            burbuja.style.display = 'flex';
            burbuja.textContent = '🤔';
        } else if (estado === 'win') {
            g3.classList.add('visible');
            burbuja.style.display = 'none';
            lanzarEstrellas();
        }
    }

    function actualizarContador() {
        for (let i = 0; i < 10; i++) {
            const dot = document.getElementById('dot-' + i);
            if (dot) {
                dot.classList.toggle('activo', i < numPreguntas);
            }
        }
    }

    function lanzarEstrellas() {
        const emojis = ['⭐', '✨', '🌟', '💫', '🎉'];
        for (let i = 0; i < 18; i++) {
            setTimeout(() => {
                const star = document.createElement('div');
                star.className = 'confetti-star';
                star.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                star.style.left = Math.random() * 100 + 'vw';
                star.style.top = '-30px';
                star.style.animationDuration = (1.5 + Math.random() * 2) + 's';
                document.body.appendChild(star);
                setTimeout(() => star.remove(), 3500);
            }, i * 100);
        }
    }

    async function hacerJugada() {
        const textoEl = document.getElementById('texto-pregunta');
        textoEl.classList.add('thinking');
        textoEl.textContent = 'El Genio está pensando...';

        try {
            const response = await fetch('/jugar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(historialRespuestas)
            });

            const data = await response.json();
            textoEl.classList.remove('thinking');

            if (data.estado === "jugando") {
                caracteristicaActual = data.pregunta;
                numPreguntas++;
                actualizarContador();

                // Cambia el genio según cuántas preguntas van
                if (numPreguntas >= 6) {
                    setGenie('thinking');
                } else {
                    setGenie('normal');
                }

                textoEl.textContent = '¿Tu personaje ' + formatearTexto(data.pregunta) + '?';
            }
            else if (data.estado === "victoria") {
                setGenie('win');
                document.getElementById('contenedor-botones').style.display = 'none';
                document.getElementById('btn-restart').style.display = 'block';
                document.getElementById('contador').style.display = 'none';
                textoEl.innerHTML = '¡Lo sabía! Tu personaje es<br><span class="resultado-personaje">' + formatearTexto(data.personaje).toUpperCase() + '</span><br><span style="font-size:14px; color:rgba(200,220,255,0.6);">después de ' + numPreguntas + ' preguntas ✨</span>';
            }
            else {
                setGenie('thinking');
                textoEl.textContent = data.mensaje || 'No logré adivinar...';
                document.getElementById('contenedor-botones').style.display = 'none';
                document.getElementById('btn-restart').style.display = 'block';
            }

            document.getElementById('consola-debug').textContent = "Historial: " + JSON.stringify(historialRespuestas);

        } catch (error) {
            textoEl.classList.remove('thinking');
            textoEl.textContent = "Error: El servidor Prolog no está corriendo.";
            console.error(error);
        }
    }

    function enviarRespuesta(respuesta) {
        historialRespuestas[caracteristicaActual] = respuesta;
        hacerJugada();
    }

    function reiniciar() {
        historialRespuestas = {};
        caracteristicaActual = "";
        numPreguntas = 0;
        actualizarContador();
        setGenie('normal');
        document.getElementById('contenedor-botones').style.display = 'flex';
        document.getElementById('btn-restart').style.display = 'none';
        document.getElementById('contador').style.display = 'flex';
        document.getElementById('consola-debug').textContent = "Historial: {}";
        hacerJugada();
    }

    hacerJugada();
</script>
</body>
</html>
